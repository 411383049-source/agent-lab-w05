<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課間我想做什麼？｜Campus Activity Picker</title>
  <style>
    :root {
      --primary: #1976d2;
      --primary-hover: #1565c0;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px 16px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
    }

    .lang-btn {
      padding: 6px 14px;
      background: #e2e8f0;
      border: none;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      color: #334155;
      transition: background 0.2s;
    }
    .lang-btn:hover { background: #cbd5e1; }

    .banner {
      background: #fef3c7;
      color: #92400e;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 20px;
      text-align: center;
      border: 1px solid #fde68a;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .filter-group {
      margin-bottom: 16px;
    }
    .filter-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .filter-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background-color: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    .filter-group select:focus {
      border-color: var(--primary);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
    }
    .btn-secondary:hover { background: #e2e8f0; }

    .shortcut-hint {
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }

    .result-box {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 16px;
      border-radius: 8px;
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      overflow: hidden;
    }
    .result-empty {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .result-none {
      color: #dc2626;
      font-weight: 600;
      font-size: 1.1rem;
      animation: fadeIn 0.3s ease-in-out;
    }
    .result-content {
      width: 100%;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-id {
      display: inline-block;
      padding: 2px 8px;
      background: #dbeafe;
      color: #1e40af;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .result-name {
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .result-tags {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: #475569;
    }
    .tag {
      background: #e2e8f0;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .history-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #334155;
    }
    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-item {
      padding: 10px 14px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeIn 0.25s ease-out;
    }
    .history-empty {
      color: #94a3b8;
      font-size: 0.85rem;
      text-align: center;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="ui-title">課間我想做什麼？</h1>
      <button class="lang-btn" id="lang-btn" onclick="toggleLang()">English</button>
    </header>

    <div class="banner" id="ui-banner">
      教學模擬活動，不是校方公告
    </div>

    <div class="card">
      <div class="filter-group">
        <label id="lbl-location" for="sel-location">地點</label>
        <select id="sel-location">
          <option value="all">不限</option>
          <option value="indoor">室內</option>
          <option value="outdoor">室外</option>
        </select>
      </div>

      <div class="filter-group">
        <label id="lbl-time" for="sel-time">可用時間</label>
        <select id="sel-time">
          <option value="15">15 分鐘</option>
          <option value="30" selected>30 分鐘</option>
          <option value="60">60 分鐘</option>
        </select>
      </div>

      <div class="filter-group">
        <label id="lbl-energy" for="sel-energy">活動強度</label>
        <select id="sel-energy">
          <option value="all">不限</option>
          <option value="low">低</option>
          <option value="medium">中</option>
        </select>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="btn-pick" onclick="pickActivity()">幫我選</button>
        <button class="btn btn-secondary" id="btn-reset" onclick="resetFilters()">重設篩選</button>
      </div>
      <div class="shortcut-hint" id="ui-shortcut-hint">
        ⌨️ 快捷鍵：按 Enter 鍵快速挑選，按 R 鍵重設篩選
      </div>
    </div>

    <div class="card">
      <div class="result-box" id="result-box">
        <p class="result-empty" id="ui-prompt">設定好篩選條件，點擊「幫我選」開始！</p>
      </div>
    </div>

    <div class="card">
      <div class="history-header">
        <h2 id="ui-history-title">最近抽選紀錄（最多 5 筆）</h2>
        <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.8rem; flex: none;" id="btn-clear" onclick="clearHistory()">清除紀錄</button>
      </div>
      <ul class="history-list" id="history-list">
        <li class="history-empty" id="ui-history-empty">尚無抽選紀錄</li>
      </ul>
    </div>
  </div>

  <script>
    const activities = [
      { id: "A01", name_zh: "整理書包", name_en: "Organize your bag", location_type: "indoor", minutes: 10, energy: "low" },
      { id: "A02", name_zh: "畫一張小卡", name_en: "Draw a small card", location_type: "indoor", minutes: 15, energy: "low" },
      { id: "A03", name_zh: "寫三句讀書筆記", name_en: "Write three study notes", location_type: "indoor", minutes: 10, energy: "low" },
      { id: "A04", name_zh: "安靜讀兩頁書", name_en: "Read two pages quietly", location_type: "indoor", minutes: 15, energy: "low" },
      { id: "A05", name_zh: "排好明日待辦", name_en: "Plan tomorrow’s tasks", location_type: "indoor", minutes: 20, energy: "low" },
      { id: "A06", name_zh: "整理本機練習檔", name_en: "Organize practice files", location_type: "indoor", minutes: 30, energy: "medium" },
      { id: "A07", name_zh: "在合適位置慢走", name_en: "Take a gentle walk in a suitable area", location_type: "outdoor", minutes: 15, energy: "low" },
      { id: "A08", name_zh: "觀察天空並畫草圖", name_en: "Observe the sky and sketch", location_type: "outdoor", minutes: 20, energy: "low" },
      { id: "A09", name_zh: "在合適位置快走", name_en: "Take a brisk walk in a suitable area", location_type: "outdoor", minutes: 30, energy: "medium" },
      { id: "A10", name_zh: "規劃小組練習", name_en: "Plan a group exercise", location_type: "indoor", minutes: 45, energy: "medium" },
      { id: "A11", name_zh: "記錄自然色彩", name_en: "Record colors in nature", location_type: "outdoor", minutes: 45, energy: "low" },
      { id: "A12", name_zh: "構思下一次社團活動", name_en: "Brainstorm a future club activity", location_type: "indoor", minutes: 60, energy: "medium" }
    ];

    let currentLang = 'zh';
    let historyRecords = [];
    let lastPickedActivity = null;
    let lastPickState = 'empty';

    const translations = {
      zh: {
        title: "課間我想做什麼？",
        langBtn: "English",
        banner: "教學模擬活動，不是校方公告",
        location: "地點",
        locAll: "不限",
        locIndoor: "室內",
        locOutdoor: "室外",
        time: "可用時間",
        time15: "15 分鐘",
        time30: "30 分鐘",
        time60: "60 分鐘",
        energy: "活動強度",
        energyAll: "不限",
        energyLow: "低",
        energyMedium: "中",
        pickBtn: "幫我選",
        resetBtn: "重設篩選",
        shortcutHint: "⌨️ 快捷鍵：按 Enter 鍵快速挑選，按 R 鍵重設篩選",
        emptyPrompt: "設定好篩選條件，點擊「幫我選」開始！",
        noMatch: "沒有符合條件的活動",
        historyTitle: "最近抽選紀錄（最多 5 筆）",
        clearBtn: "清除紀錄",
        historyEmpty: "尚無抽選紀錄",
        mins: "分鐘",
        intensitySuffix: "強度"
      },
      en: {
        title: "What should I do between classes?",
        langBtn: "中文",
        banner: "Teaching simulation activities, not official school announcements",
        location: "Location",
        locAll: "All",
        locIndoor: "Indoor",
        locOutdoor: "Outdoor",
        time: "Available Time",
        time15: "15 mins",
        time30: "30 mins",
        time60: "60 mins",
        energy: "Energy Level",
        energyAll: "All",
        energyLow: "Low",
        energyMedium: "Medium",
        pickBtn: "Pick for me",
        resetBtn: "Reset filters",
        shortcutHint: "⌨️ Shortcuts: Press Enter to pick, R to reset filters",
        emptyPrompt: "Set your filters and click \"Pick for me\" to start!",
        noMatch: "No matching activities found",
        historyTitle: "Recent picks (Up to 5)",
        clearBtn: "Clear history",
        historyEmpty: "No history yet",
        mins: "mins",
        intensitySuffix: "intensity"
      }
    };

    function toggleLang() {
      currentLang = (currentLang === 'zh') ? 'en' : 'zh';
      applyLang();
    }

    function applyLang() {
      const t = translations[currentLang];
      document.getElementById('ui-title').textContent = t.title;
      document.getElementById('lang-btn').textContent = t.langBtn;
      document.getElementById('ui-banner').textContent = t.banner;
      
      document.getElementById('lbl-location').textContent = t.location;
      document.querySelector('#sel-location option[value="all"]').textContent = t.locAll;
      document.querySelector('#sel-location option[value="indoor"]').textContent = t.locIndoor;
      document.querySelector('#sel-location option[value="outdoor"]').textContent = t.locOutdoor;

      document.getElementById('lbl-time').textContent = t.time;
      document.querySelector('#sel-time option[value="15"]').textContent = t.time15;
      document.querySelector('#sel-time option[value="30"]').textContent = t.time30;
      document.querySelector('#sel-time option[value="60"]').textContent = t.time60;

      document.getElementById('lbl-energy').textContent = t.energy;
      document.querySelector('#sel-energy option[value="all"]').textContent = t.energyAll;
      document.querySelector('#sel-energy option[value="low"]').textContent = t.energyLow;
      document.querySelector('#sel-energy option[value="medium"]').textContent = t.energyMedium;

      document.getElementById('btn-pick').textContent = t.pickBtn;
      document.getElementById('btn-reset').textContent = t.resetBtn;
      document.getElementById('ui-shortcut-hint').textContent = t.shortcutHint;
      document.getElementById('ui-history-title').textContent = t.historyTitle;
      document.getElementById('btn-clear').textContent = t.clearBtn;
      document.getElementById('ui-history-empty').textContent = t.historyEmpty;

      renderHistory();
      if (lastPickedActivity) {
        renderResult(lastPickedActivity);
      } else if (lastPickState === 'none') {
        renderNoMatch();
      } else {
        document.getElementById('result-box').innerHTML = `<p class="result-empty">${t.emptyPrompt}</p>`;
      }
    }

    function pickActivity() {
      const loc = document.getElementById('sel-location').value;
      const maxTime = parseInt(document.getElementById('sel-time').value, 10);
      const energy = document.getElementById('sel-energy').value;

      const filtered = activities.filter(act => {
        if (loc !== 'all' && act.location_type !== loc) return false;
        if (act.minutes > maxTime) return false;
        if (energy !== 'all' && act.energy !== energy) return false;
        return true;
      });

      if (filtered.length === 0) {
        lastPickedActivity = null;
        lastPickState = 'none';
        renderNoMatch();
      } else {
        let candidates = filtered;
        if (filtered.length > 1 && lastPickedActivity) {
          const nonRepeat = filtered.filter(a => a.id !== lastPickedActivity.id);
          if (nonRepeat.length > 0) candidates = nonRepeat;
        }

        const picked = candidates[Math.floor(Math.random() * candidates.length)];
        lastPickedActivity = picked;
        lastPickState = 'picked';
        renderResult(picked);

        historyRecords.unshift(picked);
        if (historyRecords.length > 5) {
          historyRecords.pop();
        }
        renderHistory();
      }
    }

    function renderResult(act) {
      const t = translations[currentLang];
      const name = currentLang === 'zh' ? act.name_zh : act.name_en;
      const locText = act.location_type === 'indoor' ? t.locIndoor : t.locOutdoor;
      const energyText = act.energy === 'low' ? (currentLang === 'zh' ? '低強度' : 'Low energy') : (currentLang === 'zh' ? '中強度' : 'Medium energy');

      document.getElementById('result-box').innerHTML = `
        <div class="result-content">
          <span class="result-id">${act.id}</span>
          <div class="result-name">${name}</div>
          <div class="result-tags">
            <span class="tag">⏱️ ${act.minutes} ${t.mins}</span>
            <span class="tag">📍 ${locText}</span>
            <span class="tag">⚡ ${energyText}</span>
          </div>
        </div>
      `;
    }

    function renderNoMatch() {
      const t = translations[currentLang];
      document.getElementById('result-box').innerHTML = `
        <p class="result-none">${t.noMatch}</p>
      `;
    }

    function resetFilters() {
      document.getElementById('sel-location').value = 'all';
      document.getElementById('sel-time').value = '30';
      document.getElementById('sel-energy').value = 'all';
    }

    function clearHistory() {
      historyRecords = [];
      renderHistory();
    }

    function renderHistory() {
      const listEl = document.getElementById('history-list');
      const t = translations[currentLang];
      if (historyRecords.length === 0) {
        listEl.innerHTML = `<li class="history-empty">${t.historyEmpty}</li>`;
        return;
      }

      listEl.innerHTML = historyRecords.map(act => {
        const name = currentLang === 'zh' ? act.name_zh : act.name_en;
        const loc = act.location_type === 'indoor' ? t.locIndoor : t.locOutdoor;
        return `
          <li class="history-item">
            <span><strong>${act.id}</strong> - ${name}</span>
            <span style="color: var(--text-muted); font-size: 0.8rem;">${act.minutes} ${t.mins} · ${loc}</span>
          </li>
        `;
      }).join('');
    }

    // Keyboard shortcuts: Enter = pick, r/R = reset
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
      if (e.key === 'Enter') {
        e.preventDefault();
        pickActivity();
      } else if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        resetFilters();
      }
    });
  </script>
</body>
</html>
